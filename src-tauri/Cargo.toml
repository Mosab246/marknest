[package]
name = "marknest"
version = "0.2.0"
description = "Local-first bookmark knowledge manager for saving, organizing, searching, and annotating links and web resources"
authors = ["MarkNest contributors"]
edition = "2021"

[lib]
name = "marknest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tiny_http = "0.12"
url = "2"
log = "0.4"

