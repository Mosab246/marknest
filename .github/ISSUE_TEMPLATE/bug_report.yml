name: Bug report
description: Report something broken in the desktop app or Chrome extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MarkNest. This project is in **early preview**.

        For **security vulnerabilities**, do not use this form—see [SECURITY.md](../../SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app (Tauri)
        - Chrome extension
        - Capture bridge (127.0.0.1:4763)
        - Both desktop and extension
        - Documentation / build
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MarkNest version
      description: App version from Settings or package.json (e.g. 0.2.0)
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: extension_version
    attributes:
      label: Extension version (if applicable)
      placeholder: "0.2.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if extension involved)
      placeholder: "Chrome 136"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps work best
      placeholder: |
        1. Start MarkNest with `npm run tauri dev`
        2. Load extension unpacked
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Terminal output, bridge status from Settings, or extension console errors. Redact personal paths if needed.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I am not reporting a secret/API key or private data leak in this issue
          required: true
